# Example site config. Each real deployment has its own file.
#
# Zone polygons use normalised image coordinates (0..1); the pipeline
# converts detector pixel bboxes to this space before rule evaluation.
site: taichung_plant_01

model:
  weights: detector.pt  # Stage I = generic COCO weights (person only).
                        # Stage II: replace with the Hailo-compiled HEF of
                        # a helmet / vest-trained checkpoint.

zones:
  # Stage I demo zone — any `person` dwelling in this box fires an alert.
  # Works out of the box with COCO weights.
  - name: restricted_zone
    camera: CAM-42
    polygon: [[0.0, 0.0], [1.0, 0.0], [1.0, 1.0], [0.0, 1.0]]
    rules: [restricted_access]
    severity: HIGH

  # ----- Stage II zones (require a helmet/vest-aware detector) -----
  # - name: crane_zone
  #   camera: CAM-42
  #   polygon: [[0.3, 0.1], [0.9, 0.1], [0.9, 0.9], [0.3, 0.9]]
  #   rules: [helmet_mandatory, lone_worker_forbidden]
  #
  # - name: loading_bay
  #   camera: CAM-07
  #   polygon: [[0.0, 0.5], [1.0, 0.5], [1.0, 1.0], [0.0, 1.0]]
  #   rules: [reflective_vest_mandatory]

policies:
  min_dwell_frames: 15      # ~0.5 s @ 30 fps
  cooldown_frames: 300      # ~10 s — one alert per track per window

reporter:
  model_path: null          # drop a Qwen2.5-0.5B.gguf path here for live LLM
  n_ctx: 1024
  n_threads: 4

outputs:
  mqtt:
    enabled: false
    host: localhost
    port: 1883
    topic: sentinel/events
  line:
    token: null             # set your LINE Notify token
  teams:
    webhook: null           # set your Teams incoming webhook URL
